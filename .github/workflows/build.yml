name: TWRP Build - RedMagic 10 Pro (NX789J)

on:
  workflow_dispatch:

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MANIFEST_URL: 'https://github.com/TWRP-Test/platform_manifest_twrp_aosp'
      MANIFEST_BRANCH: 'twrp-16.0'
      DEVICE_TREE_URL: 'https://github.com/reminon/twrp_device_nubia_nx789j'
      DEVICE_TREE_BRANCH: 'twrp-16.0'
      DEVICE_PATH: 'device/nubia/NX789J'
      DEVICE_NAME: 'NX789J'
      MAKEFILE_NAME: 'twrp_NX789J'
      BUILD_TARGET: 'recovery'

    steps:
    - name: Display Build Parameters
      run: |
        echo "::group::Build Configuration"
        echo "Device: Nubia RedMagic 10 Pro (NX789J)"
        echo "SoC: Snapdragon 8 Elite (sun)"
        echo "Android: 16"
        echo "TWRP: 16.0 (3.7.1)"
        echo "Manifest: ${{ env.MANIFEST_BRANCH }}"
        echo "Device Tree: ${{ env.DEVICE_TREE_URL }} @ ${{ env.DEVICE_TREE_BRANCH }}"
        echo "Build Target: ${{ env.BUILD_TARGET }}.img"
        echo "::endgroup::"

    - name: Check Out
      uses: actions/checkout@v4

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Maximize build space
      uses: easimon/maximize-build-space@master

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        create-symlink: true

    - name: Setup zram swap
      run: |
        sudo apt install linux-modules-extra-$(uname -r) zram-tools -y
        sudo modprobe zram
        sudo sed -i 's/^#PERCENT=50/PERCENT=90/' /etc/default/zramswap
        sudo sed -i 's/^#PRIORITY=100/PRIORITY=1000/' /etc/default/zramswap
        sudo systemctl restart zramswap

    - name: Prepare the environment
      run: |
        export DEBIAN_FRONTEND=noninteractive
        sudo apt update && sudo apt upgrade -y
        sudo apt install repo -y
        git config --global user.name "JueN-Sar"
        git config --global user.email "info2de1oyun@gmail.com"

    - name: Sync source
      run: |
        mkdir workspace
        cd workspace
        repo init -u ${{ env.MANIFEST_URL }} -b ${{ env.MANIFEST_BRANCH }} --depth=1
        (while true; do echo "Syncing source..."; sleep 60; done) &
        TIP_PID=$!
        repo sync -j$(nproc --all)
        kill $TIP_PID && exit 0

    - name: Clone device tree
      run: |
        git clone ${{ env.DEVICE_TREE_URL }} -b ${{ env.DEVICE_TREE_BRANCH }} ./${{ env.DEVICE_PATH }}
      working-directory: workspace

    - name: Building recovery
      run: |
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export CCACHE_DIR=.ccache
        export CCACHE_EXEC=$(command -v ccache)
        export CCACHE_MAXSIZE=5G
        export USE_CCACHE=1
        lunch ${{ env.MAKEFILE_NAME }}
        (while true; do echo "$(date +%T) Building TWRP..."; free -h; sleep 10; done) &
        TIP_PID=$!
        m ${{ env.BUILD_TARGET }}image
        kill $TIP_PID && exit 0
      working-directory: workspace

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          workspace/out/target/product/${{ env.DEVICE_NAME }}/${{ env.BUILD_TARGET }}.img
        name: TWRP-16.0-${{ env.DEVICE_NAME }}-${{ github.run_id }}
        tag_name: ${{ github.run_id }}
        body: |
          ## TWRP 16.0 for Nubia RedMagic 10 Pro (NX789J)

          **SoC:** Snapdragon 8 Elite (sun)
          **TWRP:** 16.0 (3.7.1)
          **Android:** 16
          **Target:** ${{ env.BUILD_TARGET }}.img

          ### Features
          - Working decryption (FBE fscrypt policy 2)
          - ADB, Fastbootd, USB OTG, MTP
          - Backup / Restore / ZIP flashing

          ### Credits
          - Device tree by [reminon](https://github.com/reminon)
          - Build by [JueN-Sar](https://github.com/JueN-Sar) & [Claude](https://claude.ai)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
